<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shot Labeler</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #111; --fg: #eee; --muted: #888; --accent: #ff3b30; --panel: #1c1c1c; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
  #wrap { position: relative; display: inline-block; cursor: crosshair; }
  video { display: block; max-width: 100vw; }
  .mark { position: absolute; width: 28px; height: 28px; margin: -17px 0 0 -17px; border: 3px solid var(--accent); border-radius: 50%; box-shadow: 0 0 0 2px #fff8; pointer-events: none; }
  #bar { padding: 8px 12px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; background: var(--panel); }
  #time { font-variant-numeric: tabular-nums; font-size: 18px; min-width: 90px; }
  #help { color: var(--muted); }
  #status { color: #4cd964; }
  #list { padding: 8px 12px; columns: 4; font-variant-numeric: tabular-nums; }
  #list div { cursor: pointer; } #list div:hover { color: var(--accent); }
  button { background: #333; color: var(--fg); border: 1px solid #555; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
<div id="wrap"><video id="v" src="clip.mp4" preload="auto"></video></div>
<div id="bar">
  <span id="time">0.00s</span>
  <span id="rate">1x</span>
  <span id="count">0 shots</span>
  <button id="save">Save</button>
  <span id="status"></span>
  <span id="help">Click the shooter at the moment of release · Space play/pause · , . step 1 frame · ← → 1s · [ ] speed · Z undo · click a row to jump / shift-click to delete</span>
</div>
<div id="list"></div>
<script>
const SRC_W = 3490, SRC_H = 1400, FPS = 60;
const v = document.getElementById("v"), wrap = document.getElementById("wrap");
let labels = [];
const rates = [0.25, 0.5, 1, 2]; let ri = 2;

function render() {
  wrap.querySelectorAll(".mark").forEach(e => e.remove());
  const sx = v.clientWidth / SRC_W, sy = v.clientHeight / SRC_H;
  for (const l of labels) {
    if (Math.abs(l.t - v.currentTime) > 0.5) continue;
    const m = document.createElement("div"); m.className = "mark";
    m.style.left = l.x * sx + "px"; m.style.top = l.y * sy + "px"; wrap.appendChild(m);
  }
  document.getElementById("time").textContent = v.currentTime.toFixed(2) + "s";
  document.getElementById("count").textContent = labels.length + " shots";
  const list = document.getElementById("list"); list.innerHTML = "";
  labels.forEach((l, i) => {
    const d = document.createElement("div"); d.textContent = `${l.t.toFixed(2)}s  (${l.x}, ${l.y})`;
    d.onclick = e => { if (e.shiftKey) { labels.splice(i, 1); dirty(); } else v.currentTime = l.t; render(); };
    list.appendChild(d);
  });
}
function dirty() { document.getElementById("status").textContent = "unsaved"; render(); }

wrap.addEventListener("click", e => {
  const r = v.getBoundingClientRect();
  labels.push({ t: +v.currentTime.toFixed(3),
    x: Math.round((e.clientX - r.left) / r.width * SRC_W), y: Math.round((e.clientY - r.top) / r.height * SRC_H) });
  labels.sort((a, b) => a.t - b.t); dirty();
});
document.addEventListener("keydown", e => {
  const k = e.key;
  if (k === " ") { e.preventDefault(); v.paused ? v.play() : v.pause(); }
  else if (k === ",") { v.pause(); v.currentTime -= 1 / FPS; }
  else if (k === ".") { v.pause(); v.currentTime += 1 / FPS; }
  else if (k === "ArrowLeft") v.currentTime -= 1;
  else if (k === "ArrowRight") v.currentTime += 1;
  else if (k === "[" || k === "]") { ri = Math.max(0, Math.min(rates.length - 1, ri + (k === "]" ? 1 : -1))); v.playbackRate = rates[ri]; document.getElementById("rate").textContent = rates[ri] + "x"; }
  else if (k === "z" || k === "Z") { labels.pop(); dirty(); }
  else return;
  e.preventDefault();
});
v.addEventListener("timeupdate", render);
v.addEventListener("seeked", render);

async function save() {
  const r = await fetch("labels", { method: "POST", body: JSON.stringify(labels, null, 1) });
  document.getElementById("status").textContent = r.ok ? `saved ${labels.length}` : "save failed";
}
document.getElementById("save").onclick = save;
setInterval(() => { if (document.getElementById("status").textContent === "unsaved") save(); }, 5000);
fetch("labels").then(r => r.ok ? r.json() : []).then(j => { labels = j; render(); });
</script>
</body>
</html>
