<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lens Tuner</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #0f1012; --panel: #17191c; --fg: #e8e8e8; --muted: #8a8f98; --line: #2a2d32; --accent: #4da3ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; display: flex; height: 100vh; overflow: hidden; }
  #panel { width: 330px; min-width: 330px; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 12px 40px; }
  #stage { flex: 1; position: relative; overflow: hidden; }
  canvas { position: absolute; left: 0; top: 0; }
  #gl { background: #141414; }
  #ov { cursor: crosshair; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; border-top: 1px solid var(--line); padding-top: 10px; }
  h2:first-of-type { border-top: 0; margin-top: 4px; }
  .row { display: grid; grid-template-columns: 92px 1fr 64px; gap: 6px; align-items: center; margin: 3px 0; }
  .row label { color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row input[type=range] { width: 100%; }
  .row input[type=number] { width: 64px; background: #0c0d0f; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; font: 12px ui-monospace, monospace; }
  .chk { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  .hint { color: var(--muted); font-size: 11px; margin: 2px 0 6px; line-height: 1.35; }
  button, select { background: #23262b; color: var(--fg); border: 1px solid #3a3e45; border-radius: 5px; padding: 5px 10px; cursor: pointer; font: inherit; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #04111f; font-weight: 600; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  #stats { font: 11.5px ui-monospace, monospace; line-height: 1.5; white-space: pre; color: #cfd3da; }
  #status { color: #6fdc8c; font-size: 12px; min-height: 16px; }
  #help { position: absolute; right: 10px; bottom: 8px; color: #aaa; font-size: 11px; background: #000a; padding: 4px 8px; border-radius: 4px; pointer-events: none; }
</style>
</head>
<body>
<div id="panel">
  <div class="btns">
    <button class="primary" id="save">Save</button>
    <button id="revert" title="Reload the last saved values">Revert</button>
    <select id="image"></select>
  </div>
  <div id="status"></div>
  <div id="controls"></div>
  <h2>Overlays</h2>
  <div id="overlays"></div>
  <h2>Measurements</h2>
  <div class="hint">Angle = degrees from horizontal. Bend = RMS px off the best straight line.</div>
  <div id="stats"></div>
</div>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="ov"></canvas>
  <div id="help">drag a numbered corner: stretch that half · drag elsewhere: draw ruler · shift/right-drag: pan · wheel: zoom · dbl-click: fit · ⌫ undo ruler · C clear</div>
</div>
<script>
"use strict";
// ---------- model (keep in sync with lens.py build()) ----------
const SPEC = [
  ["Lens (equipment)", null],
  ["k1", "equipment.k1", -0.6, 0.6, 0.005],
  ["k2", "equipment.k2", -0.5, 0.5, 0.005],
  ["k3", "equipment.k3", -0.5, 0.5, 0.005],
  ["center y", "equipment.cy", -600, 1400, 1],
  ["focal L", "equipment.f.left", 300, 5000, 1],
  ["focal R", "equipment.f.right", 300, 5000, 1],
  ["zoom", "equipment.zoom", 0.2, 2.5, 0.01],
  ["Camera turn (mirrored L/R)", null],
  ["yaw", "camera.yaw", -60, 60, 0.1],
  ["pitch", "camera.pitch", -60, 60, 0.1],
  ["roll", "camera.roll", -30, 30, 0.1],
  ["Stitch", null],
  ["seam x", "seam", 1500, 2100, 1],
  ["shear", "shear", -1, 2, 0.01],
  ["!align", "align", "baselines meet at the seam"],
  ["!collinear", "collinear", "baselines on one straight line"],
  ["Pillar warp (right half)", null],
  ["!seam_warp.enabled", "seam_warp.enabled", "enabled"],
  ["shift top", "seam_warp.dx.0.1", -80, 80, 0.5],
  ["shift base", "seam_warp.dx.1.1", -80, 80, 0.5],
  ["fade px", "seam_warp.fade_px", 1, 1500, 1],
  ["Parallelogram (0 = off, 1 = opposite sides parallel)", null],
  ["left half", "parallelogram.left", -0.5, 1.5, 0.01],
  ["right half", "parallelogram.right", -0.5, 1.5, 0.01],
  ["Corner pin: left half (px; x+ right, y+ down)", null],
  ["BR (seam) x", "corner_pin.left.bottom_right.0", -1500, 1500, 1],
  ["BR (seam) y", "corner_pin.left.bottom_right.1", -1500, 1500, 1],
  ["BL x", "corner_pin.left.bottom_left.0", -1500, 1500, 1],
  ["BL y", "corner_pin.left.bottom_left.1", -1500, 1500, 1],
  ["TL x", "corner_pin.left.top_left.0", -800, 800, 1],
  ["TL y", "corner_pin.left.top_left.1", -800, 800, 1],
  ["Corner pin: right half (px; x+ right, y+ down)", null],
  ["BL (seam) x", "corner_pin.right.bottom_left.0", -1500, 1500, 1],
  ["BL (seam) y", "corner_pin.right.bottom_left.1", -1500, 1500, 1],
  ["BR x", "corner_pin.right.bottom_right.0", -1500, 1500, 1],
  ["BR y", "corner_pin.right.bottom_right.1", -1500, 1500, 1],
  ["TR x", "corner_pin.right.top_right.0", -800, 800, 1],
  ["TR y", "corner_pin.right.top_right.1", -800, 800, 1],

let CFG, P, IMG = {}, W = 3490, H = 1400;

const get = (o, path) => path.split(".").reduce((a, k) => a[k], o);
function set(o, path, v) { const ks = path.split("."); const last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; }

const mul = (a, b) => [0, 1, 2].map(i => [0, 1, 2].map(j => a[i][0] * b[0][j] + a[i][1] * b[1][j] + a[i][2] * b[2][j]));

const ap = (Hm, p) => { const x = Hm[0][0] * p[0] + Hm[0][1] * p[1] + Hm[0][2], y = Hm[1][0] * p[0] + Hm[1][1] * p[1] + Hm[1][2], z = Hm[2][0] * p[0] + Hm[2][1] * p[1] + Hm[2][2]; return [x / z, y / z]; };
const I3 = () => [[1, 0, 0], [0, 1, 0], [0, 0, 1]];

function undistort(pts, K, D, Pm, iters = 50) {  // K, Pm = {f, cx, cy}; D = [k1, k2, k3]
  return pts.map(([px, py]) => {
    const xd = (px - K.cx) / K.f, yd = (py - K.cy) / K.f;
    let x = xd, y = yd;
    for (let i = 0; i < iters; i++) { const r2 = x * x + y * y; const s = 1 + D[0] * r2 + D[1] * r2 * r2 + D[2] * r2 * r2 * r2; x = xd / s; y = yd / s; }
    return [x * Pm.f + Pm.cx, y * Pm.f + Pm.cy];

}
function polyfit1(pts) {
  const n = pts.length; let sx = 0, sy = 0, sxx = 0, sxy = 0;
  for (const [x, y] of pts) { sx += x; sy += y; sxx += x * x; sxy += x * y; }

function rotation(f, xs, cy, yaw, pitch, roll) {

  const Ry = [[Math.cos(y), 0, Math.sin(y)], [0, 1, 0], [-Math.sin(y), 0, Math.cos(y)]];
  const Rx = [[1, 0, 0], [0, Math.cos(p), -Math.sin(p)], [0, Math.sin(p), Math.cos(p)]];
  const Rz = [[Math.cos(r), -Math.sin(r), 0], [Math.sin(r), Math.cos(r), 0], [0, 0, 1]];

const finite = M => M.every(r => r.every(Number.isFinite));

function build(P) {

      let outer = b[0]; for (const q of b) if (Math.abs(q[0] - (h.w - xs)) < Math.abs(outer[0] - (h.w - xs))) outer = q;

    if (CFG.lines && CFG.lines.near_wall) {
      const h = hs[s], x0 = h.x0, loc = pts => halfPts(h, pts.map(([x, y]) => [x - x0, y]));
      const far = tls(loc(CFG.baseline[s])), side = tls(loc(CFG.lines.side_wall[s]));
      const near = tls(loc(CFG.lines.near_wall[s])), zone = tls(loc(CFG.lines.zone_line[s]));
      const src = [[far, side], [far, zone], [near, zone], [near, side]].map(([a, b]) => { const x = cross(a, b); return [x[0] / x[2], x[1] / x[2]]; });

      const q = P.quad && P.quad[s];
      if (q) { const Hq = perspective(src, q.map(([x, y]) => [x - x0, y])); if (finite(Hq)) h.Hm = mul(Hq, h.Hm); }

}
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
function tls(pts) {  // best-fit line (a, b, c), a x + b y + c = 0, unit normal; same as lens.py _tls_line
  const n = pts.length, mx = pts.reduce((a, p) => a + p[0], 0) / n, my = pts.reduce((a, p) => a + p[1], 0) / n;
  let sxx = 0, syy = 0, sxy = 0; for (const [x, y] of pts) { sxx += (x - mx) ** 2; syy += (y - my) ** 2; sxy += (x - mx) * (y - my); }

function affineFrom(src, dst) {  // 3 point pairs -> 3x3 affine

// ---------- WebGL ----------
const gl = document.getElementById("gl").getContext("webgl", { preserveDrawingBuffer: true });
const VS = `attribute vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }`;
const FS = `precision highp float;
uniform sampler2D uTex; uniform vec2 uSize, uCanvas; uniform vec3 uView; uniform float uSeam;
uniform mat3 uHinvL, uHinvR; uniform vec3 uKL, uKR, uPL, uPR, uD; uniform vec2 uWidths;
uniform float uSwOn, uOutside; uniform vec4 uSw1, uSw2; uniform vec3 uSw3;

const loc = gl.getAttribLocation(prog, "a"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);

for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);

// ---------- view / overlays ----------
const glc = document.getElementById("gl"), ov = document.getElementById("ov"), ctx = ov.getContext("2d"), stage = document.getElementById("stage");
let view = { x: 0, y: 0, s: 0.4 }, rulers = [], drag = null, M = null;
const show = { "far baseline": true };
function fit() { view.s = Math.min(stage.clientWidth / W, stage.clientHeight / H); view.x = -(stage.clientWidth / view.s - W) / 2; view.y = -(stage.clientHeight / view.s - H) / 2; }
function resize() {
  const dpr = window.devicePixelRatio || 1;
  for (const c of [glc, ov]) { c.width = stage.clientWidth * dpr; c.height = stage.clientHeight * dpr; c.style.width = stage.clientWidth + "px"; c.style.height = stage.clientHeight + "px"; }
  render();
}
const toScreen = ([x, y]) => [(x - view.x) * view.s, (y - view.y) * view.s];
const toWorld = (sx, sy) => [view.x + sx / view.s, view.y + sy / view.s];

function fitLine(pts) {
  const n = pts.length, mx = pts.reduce((a, p) => a + p[0], 0) / n, my = pts.reduce((a, p) => a + p[1], 0) / n;
  let sxx = 0, syy = 0, sxy = 0; for (const [x, y] of pts) { sxx += (x - mx) ** 2; syy += (y - my) ** 2; sxy += (x - mx) * (y - my); }
  const th = 0.5 * Math.atan2(2 * sxy, sxx - syy), d = [Math.cos(th), Math.sin(th)];
  const t = pts.map(([x, y]) => (x - mx) * d[0] + (y - my) * d[1]), e = pts.map(([x, y]) => -(x - mx) * d[1] + (y - my) * d[0]);
  let ang = th * 180 / Math.PI; ang = ((ang + 90) % 180 + 180) % 180 - 90;
  return { m: [mx, my], d, t0: Math.min(...t), t1: Math.max(...t), angle: Math.abs(ang), bend: Math.sqrt(e.reduce((a, v) => a + v * v, 0) / n) };
}

function render() {
  if (!M) return;
  const dpr = window.devicePixelRatio || 1;
  gl.viewport(0, 0, glc.width, glc.height);
  gl.uniform2f(U("uSize"), W, H); gl.uniform2f(U("uCanvas"), glc.width, glc.height);
  gl.uniform3f(U("uView"), view.x, view.y, view.s * dpr); gl.uniform1f(U("uSeam"), M.seam);
  const L = M.hs.left, R = M.hs.right, T = m => [m[0][0], m[1][0], m[2][0], m[0][1], m[1][1], m[2][1], m[0][2], m[1][2], m[2][2]];
  gl.uniformMatrix3fv(U("uHinvL"), false, T(L.Hinv)); gl.uniformMatrix3fv(U("uHinvR"), false, T(R.Hinv));
  gl.uniform3f(U("uKL"), L.K.f, L.K.cx, L.K.cy); gl.uniform3f(U("uKR"), R.K.f, R.K.cx, R.K.cy);
  gl.uniform3f(U("uPL"), L.Pm.f, L.Pm.cx, L.Pm.cy); gl.uniform3f(U("uPR"), R.Pm.f, R.Pm.cx, R.Pm.cy);
  gl.uniform3f(U("uD"), ...L.D); gl.uniform2f(U("uWidths"), L.w, R.w);
  const sw = M.sw; gl.uniform1f(U("uSwOn"), sw ? 1 : 0); gl.uniform1f(U("uOutside"), show.__outside ? 1 : 0);
  if (sw) { gl.uniform4f(U("uSw1"), sw.pad_top[0], sw.pad_top[1], sw.base[0], sw.base[1]); gl.uniform4f(U("uSw2"), sw.dx[0][0], sw.dx[0][1], sw.dx[1][0], sw.dx[1][1]); gl.uniform3f(U("uSw3"), sw.fade_px, sw.rows[0], sw.rows[1]); }
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  drawOverlay();
}

function drawOverlay() {
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, ov.width, ov.height);
  const stats = [];
  const sets = [["far baseline", "#ff4dff", [CFG.baseline.left.concat(CFG.baseline.right)]]];
  for (const [name, f] of Object.entries(CFG.features)) sets.push([name, f.color, f.lines]);
  for (const [name, color, lines] of sets) {
    if (!show[name]) continue;
    lines.forEach((ln, i) => {
      const pts = lensPoints(M, ln).filter(p => p.every(Number.isFinite));
      if (pts.length < 2) return;
      const L = fitLine(pts), a = toScreen([L.m[0] + L.d[0] * (L.t0 - 200), L.m[1] + L.d[1] * (L.t0 - 200)]), b = toScreen([L.m[0] + L.d[0] * (L.t1 + 200), L.m[1] + L.d[1] * (L.t1 + 200)]);
      ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
      ctx.fillStyle = color; for (const p of pts) { const [x, y] = toScreen(p); ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 7); ctx.fill(); }
      const side = lines.length > 1 ? (i === 0 ? " L" : " R") : "";
      stats.push(`${(name.split(" (")[0] + side).padEnd(18)} angle ${L.angle.toFixed(1).padStart(5)}°  bend ${L.bend.toFixed(1).padStart(5)}px`);
    });
  }
  if (show.__quad) for (const s of ["left", "right"]) {
    const q = quadPts(s); if (!q) continue;
    ctx.strokeStyle = s === "left" ? "#ffe066" : "#ff9ff3"; ctx.lineWidth = 2; ctx.beginPath();
    q.forEach((p, i) => { const [x, y] = toScreen(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); ctx.stroke();
    q.forEach((p, i) => { const [x, y] = toScreen(p); ctx.fillStyle = ctx.strokeStyle; ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.fill();
      ctx.fillStyle = "#000"; ctx.font = "bold 10px system-ui"; ctx.fillText(String(i + 1), x - 3, y + 4); });
  }
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);
  for (const r of rulers.concat(drag && drag.ruler ? [drag.ruler] : [])) { ctx.beginPath(); ctx.moveTo(...toScreen(r[0])); ctx.lineTo(...toScreen(r[1])); ctx.stroke(); }
  ctx.setLineDash([]);
  if (show.__outside) { const a = toScreen([0, 0]), b = toScreen([W, H]); ctx.strokeStyle = "#ffffffaa"; ctx.setLineDash([4, 4]); ctx.strokeRect(a[0], a[1], b[0] - a[0], b[1] - a[1]); ctx.setLineDash([]); }
  const sx = toScreen([M.seam, 0])[0]; ctx.strokeStyle = "#ffd60066"; ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, 14); ctx.stroke();
  document.getElementById("stats").textContent = stats.join("\n");
}

function quadPts(s) { return (P.quad && P.quad[s]) || (M.hs[s] && M.hs[s].quadSrc); }
function hitHandle(sx, sy) {
  if (!show.__quad) return null;
  for (const s of ["left", "right"]) { const q = quadPts(s); if (!q) continue;
    for (let i = 0; i < 4; i++) { const [x, y] = toScreen(q[i]); if (Math.hypot(x - sx, y - sy) < 12) return { s, i }; } }
  return null;
}

// ---------- UI ----------
function buildControls() {
  const box = document.getElementById("controls"); box.innerHTML = "";
  for (const s of SPEC) {
    if (s[1] === null) { const h = document.createElement("h2"); h.textContent = s[0]; box.appendChild(h); continue; }
    if (s[0].startsWith("!")) {
      const d = document.createElement("label"); d.className = "chk";
      d.innerHTML = `<input type="checkbox"> ${s[2]}`; const c = d.querySelector("input");
      c.checked = !!get(P, s[1]); c.onchange = () => { set(P, s[1], c.checked); update(); };
      box.appendChild(d); continue;
    }
    const [label, path, min, max, step] = s, row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<label title="${path}">${label}</label><input type="range" min="${min}" max="${max}" step="${step}"><input type="number" step="${step}">`;
    const [r, n] = row.querySelectorAll("input"); r.value = n.value = get(P, path);
    r.oninput = () => { n.value = r.value; set(P, path, +r.value); update(); };
    n.onchange = () => { r.value = n.value; set(P, path, +n.value); update(); };
    box.appendChild(row);
  }
  const ovb = document.getElementById("overlays"); ovb.innerHTML = "";
  { if (show.__quad === undefined) show.__quad = true;
    const d = document.createElement("label"); d.className = "chk"; d.innerHTML = `<input type="checkbox"> corner handles (drag 1–4 on each half)`;
    const c = d.querySelector("input"); c.checked = show.__quad; c.onchange = () => { show.__quad = c.checked; drawOverlay(); }; ovb.appendChild(d);
    const b = document.createElement("div"); b.className = "btns";
    for (const s of ["left", "right"]) { const btn = document.createElement("button"); btn.textContent = `reset ${s} corners`; btn.onclick = () => { P.quad[s] = null; update(); }; b.appendChild(btn); }
    ovb.appendChild(b); }
  { const d = document.createElement("label"); d.className = "chk"; d.innerHTML = `<input type="checkbox"> show beyond the frame edges (zoom out)`;
    const c = d.querySelector("input"); c.checked = !!show.__outside; c.onchange = () => { show.__outside = c.checked; render(); }; ovb.appendChild(d); }
  for (const [name, color] of [["far baseline", "#ff4dff"], ...Object.entries(CFG.features).map(([k, f]) => [k, f.color])]) {
    if (!(name in show)) show[name] = true;
    const d = document.createElement("label"); d.className = "chk";
    d.innerHTML = `<input type="checkbox"> <span style="color:${color}">■</span> ${name}`;
    const c = d.querySelector("input"); c.checked = show[name]; c.onchange = () => { show[name] = c.checked; drawOverlay(); };
    ovb.appendChild(d);
  }
}
let pending = false;
function update() { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; try { M = build(P); render(); setStatus(""); } catch (e) { setStatus("model error: " + e, true); } }); }
function setStatus(t, err) { const s = document.getElementById("status"); s.textContent = t; s.style.color = err ? "#ff6b6b" : "#6fdc8c"; }

function loadImage(name) {
  const im = new Image(); im.onload = () => { gl.bindTexture(gl.TEXTURE_2D, tex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, im); render(); };
  im.src = name;
}
async function loadConfig() {
  CFG = await (await fetch("config")).json();
  [W, H] = CFG.size;
  P = JSON.parse(JSON.stringify({ equipment: CFG.equipment, seam: CFG.seam, shear: CFG.shear, align: CFG.align, collinear: CFG.collinear, camera: CFG.camera, seam_warp: CFG.seam_warp, corner_pin: CFG.corner_pin, parallelogram: CFG.parallelogram, quad: CFG.quad || { left: null, right: null } }));
  for (const k of ["k2", "k3", "zoom"]) if (P.equipment[k] === undefined) P.equipment[k] = k === "zoom" ? 1 : 0;
  buildControls(); M = build(P);
}
document.getElementById("revert").onclick = async () => { await loadConfig(); render(); setStatus("reverted to saved"); };
document.getElementById("save").onclick = async () => {
  const r = await fetch("save", { method: "POST", body: JSON.stringify(P) });
  const j = await r.json(); setStatus(r.ok ? `saved → ${j.saved}, rebuilt ${j.lens} (baseline ${j.baseline_rms.toFixed(2)}px)` : "save failed", !r.ok);
};
document.getElementById("image").onchange = e => loadImage(e.target.value);

ov.addEventListener("contextmenu", e => e.preventDefault());
ov.addEventListener("mousedown", e => {
  const w = toWorld(e.offsetX, e.offsetY), hit = e.button === 0 && !e.shiftKey && hitHandle(e.offsetX, e.offsetY);
  if (hit) { P.quad[hit.s] = quadPts(hit.s).map(p => p.slice()); drag = { handle: hit }; return; }
  drag = (e.shiftKey || e.button !== 0) ? { pan: true, sx: e.offsetX, sy: e.offsetY, vx: view.x, vy: view.y } : { ruler: [w, w] };
});
window.addEventListener("mousemove", e => {
  if (!drag) return;
  const r = ov.getBoundingClientRect(), ox = e.clientX - r.left, oy = e.clientY - r.top;
  if (drag.handle) { P.quad[drag.handle.s][drag.handle.i] = toWorld(ox, oy); update(); return; }
  if (drag.pan) { view.x = drag.vx - (ox - drag.sx) / view.s; view.y = drag.vy - (oy - drag.sy) / view.s; render(); }
  else { drag.ruler[1] = toWorld(ox, oy); drawOverlay(); }
});
window.addEventListener("mouseup", () => { if (drag && drag.ruler && Math.hypot(drag.ruler[1][0] - drag.ruler[0][0], drag.ruler[1][1] - drag.ruler[0][1]) > 5) rulers.push(drag.ruler); drag = null; drawOverlay(); });
ov.addEventListener("wheel", e => {
  e.preventDefault(); const w = toWorld(e.offsetX, e.offsetY), k = Math.exp(-e.deltaY * 0.0015);
  view.s *= k; view.x = w[0] - e.offsetX / view.s; view.y = w[1] - e.offsetY / view.s; render();
}, { passive: false });
ov.addEventListener("dblclick", () => { fit(); render(); });
window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Backspace") { rulers.pop(); drawOverlay(); } else if (e.key === "c" || e.key === "C") { rulers = []; drawOverlay(); }
});
window.addEventListener("resize", resize);

(async () => {
  await loadConfig();
  const sel = document.getElementById("image");
  for (const n of CFG.images) { const o = document.createElement("option"); o.value = n; o.textContent = n.replace(".jpg", ""); sel.appendChild(o); }
  fit(); resize(); loadImage(CFG.images[0]);
})();
</script>
</body>
