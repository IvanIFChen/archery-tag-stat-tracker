[project]
name = "archery-tag-stat-tracker"
version = "0.1.0"
description = "Automatic per-player stats (shots taken, ...) from Archery Tag game footage"
requires-python = ">=3.12"
dependencies = [
    "lap>=0.5.13",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "torchvision>=0.29.1",
    "ultralytics>=8.4.174",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
